[package]
name = "teapot"
version = "0.1.0"
edition = "2021"
description = "Utah teapot ray tracer on a hand-built GPU stack: kernel IR, Haswell encoder, raw i915 and DRM/KMS ioctls"

[dependencies]

[features]
# GPU renders a traversal heat map (red material, green nodes, blue triangles)
gpu-debug = []

[profile.release]
codegen-units = 1
panic = "abort"
strip = true
